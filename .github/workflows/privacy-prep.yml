name: Prepare privacy-clean history

on:
  push:
    branches: [codex/privacy-prep]
    paths: [.github/workflows/privacy-prep.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite commit identities on a new branch
        shell: bash
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            case "$GIT_AUTHOR_EMAIL" in
              *@qq.com) export GIT_AUTHOR_EMAIL="20395513+yaledai@users.noreply.github.com";;
            esac
            case "$GIT_COMMITTER_EMAIL" in
              *@qq.com) export GIT_COMMITTER_EMAIL="20395513+yaledai@users.noreply.github.com";;
            esac
          ' -- HEAD
          if git log --format='%ae%n%ce' HEAD | grep -qi '@qq[.]com$'; then
            echo 'Unexpected personal email remains in rewritten history.'
            exit 1
          fi
          git config user.name 'yaledai'
          git config user.email '20395513+yaledai@users.noreply.github.com'
          git rm .github/workflows/privacy-prep.yml
          git commit -m 'Remove temporary privacy preparation workflow'
          git push origin HEAD:refs/heads/codex/privacy-release
